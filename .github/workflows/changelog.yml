name: Generate Changelog

# Regenerates the "Unreleased" section of CHANGELOG.md from the git history
# and commits it back. The commit is tagged with "[skip ci]" so this workflow
# (and the other CI jobs) are not re-triggered by its own commit.
on:
  push:
    branches: [development, master]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate Unreleased changelog
        run: python scripts/generate_changelog.py

      - name: Commit changelog if it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m 'docs: update changelog [skip ci]'
          git push